<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genealogy of Classical Music</title>
<meta name="description" content="268 movements, schools and traditions of Western classical music, from Gregorian chant to today, with a Turkish branch: who influenced whom, who taught whom, top figures, reference recordings and profiles.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1a17">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classical Genealogy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --ink:#1b1a17; --muted:#625d54; --line:#dcd6ca; --accent:#9b2f2a;
  --band:#ebe6db;
  --font-display:"Cormorant Garamond","Georgia","Times New Roman",serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131210; --surface:#1c1a17; --ink:#eeebe4; --muted:#aaa497; --line:#302d28; --accent:#e07d6f; --band:#191815;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;flex:0 0 auto}
h1{font-family:var(--font-display);font-weight:700;font-size:27px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbox{position:relative;flex:1 1 220px;max-width:340px;display:flex}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,label:focus-within,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.toggle{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--ink);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--ink);color:var(--surface)}
#viewseg{display:none}
#stage{position:relative;flex:1;min-height:0}
#lanehead{position:absolute;left:0;right:0;top:0;height:30px;overflow:hidden;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);pointer-events:none}
#lanehead .inner{position:absolute;top:0;left:0;height:30px}
#lanehead span{position:absolute;top:7px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;font-weight:600}
#yearcol{position:absolute;left:0;top:30px;bottom:0;width:44px;overflow:hidden;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);border-right:1px solid var(--line);pointer-events:none}
#yearcol .inner{position:absolute;left:0;top:0;width:44px}
#yearcol span{position:absolute;left:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#yearcol span.dec{color:var(--ink);font-weight:600}
#scroller{position:absolute;inset:30px 0 0 44px;overflow:auto;-webkit-overflow-scrolling:touch}
svg.g{display:block}
.edge{fill:none;stroke-width:1.1;opacity:.17;transition:opacity .15s}
.edge.t{stroke-dasharray:4 3}
.node{cursor:pointer}
.node rect{stroke-width:1.2}
.node text{font-family:var(--font-body);fill:var(--ink)}
.node .nm{font-size:11px;font-weight:500}
.node .yr{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.node:hover rect{stroke-width:2.2}
.grid{stroke:var(--line);stroke-width:1}
.grid.dec{stroke:var(--muted);stroke-opacity:.45}
.band{fill:var(--band)}
.era{font-family:var(--font-display);font-size:30px;font-weight:600;fill:var(--muted);opacity:.18;letter-spacing:.04em;pointer-events:none}
svg.focus .node{opacity:.15}
svg.focus .node.on{opacity:1}
svg.focus .node.sel rect{stroke-width:3}
svg.focus .edge{opacity:.03}
svg.focus .edge.on{opacity:.95;stroke-width:2.1}
#panel{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px;max-height:38%;overflow:auto;font-size:14px;line-height:1.5}
#panel h2{font-family:var(--font-display);font-weight:700;font-size:23px;margin:0 0 2px}
#panel .meta{color:var(--muted);font-size:13px;margin-bottom:6px}
#panel .blurb{margin:4px 0 6px;max-width:80ch}
#panel .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
#panel .row b{font-size:13px;min-width:96px}
.gchip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid;background:transparent;color:var(--ink);cursor:pointer}
.gchip.dash{border-style:dashed}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:12px}
.legend svg{display:inline}
#results{position:absolute;top:calc(100% + 4px);left:0;width:min(460px,calc(100vw - 32px));max-height:min(60vh,480px);overflow:auto;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.22);padding:4px 0}
#results .rhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
#results .ritem{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;text-align:left;border:none;border-radius:0;background:transparent;padding:6px 12px;font-size:13.5px;color:var(--ink)}
#results .ritem.cur,#results .ritem:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#results .ra{color:var(--muted)}
#results .rg{font-size:12px;margin-left:auto;font-weight:500}
#pop{position:fixed;z-index:20;width:min(420px,calc(100vw - 24px));max-height:min(74vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.28);padding:12px 14px 14px;display:none;font-size:13px;line-height:1.45}
#pop.show{display:block}
#pop header{all:unset;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#pop h3{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0;line-height:1.1}
#pop .fam{font-size:12px;font-weight:600;margin-top:2px}
#pop .blurb{margin:8px 0 2px;color:var(--ink)}
.x{border:none;background:transparent;font-size:20px;line-height:1;padding:2px 6px;color:var(--muted);cursor:pointer}
.art{display:grid;grid-template-columns:22px 1fr;gap:0 6px;margin-top:10px}
.num{font-family:var(--font-display);font-size:17px;color:var(--muted);text-align:right;line-height:1.2}
.art b{font-size:13.5px}
.art ul{margin:2px 0 0;padding:0 0 0 16px;color:var(--ink)}
.art li{margin:3px 0}
.art li .rec{color:var(--muted);font-size:12px}
.art li.nt{color:var(--muted);font-style:italic;list-style:'· '}
.lk{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;margin-left:5px;border-radius:999px;border:1px solid;text-decoration:none;white-space:nowrap;font-weight:500;font-style:normal}
.lk.yt{color:#cc2a1f;border-color:#cc2a1f}
.lk.sp{color:#14833b;border-color:#14833b}
.hit{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:6px}
.note{margin-top:10px;font-size:11.5px;color:var(--muted)}
.ib{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:6px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font:italic 700 11px/1 Georgia,serif;padding:0;vertical-align:1px;cursor:pointer}
.ib.has{background:var(--accent);color:#fff}
.ib.rich{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
#drawer{position:fixed;z-index:30;top:0;right:0;height:100vh;height:100dvh;width:min(470px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 36px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .22s ease;overflow:auto;font-size:13.5px;line-height:1.55;padding:0 18px 28px}
#drawer.show{transform:none}
#drawer .dh{position:sticky;top:0;background:var(--surface);padding:14px 0 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:1}
#drawer h2{font-family:var(--font-display);font-weight:700;font-size:28px;margin:0;line-height:1.1}
#drawer .kind{font-size:12px;font-weight:600;color:var(--accent);margin-top:3px}
#drawer h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:600}
#drawer dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;margin:12px 0 0}
#drawer dt{color:var(--muted);font-size:12.5px}
#drawer dd{margin:0}
#drawer .sum{margin:12px 0 0}
#drawer ul{margin:0;padding-left:18px}
#drawer li{margin:3px 0}
#drawer .wk li .rec{color:var(--muted);font-size:12px}
#drawer .crow{display:flex;flex-wrap:wrap;gap:6px}
#drawer .src{margin-top:18px;font-size:12px;color:var(--muted)}
#drawer .src a,#drawer .read a{color:var(--accent)}
#drawer .read{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
#drawer .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#about{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#about.show{display:flex}
#about .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:18px 22px 24px;font-size:14px;line-height:1.6;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#about h2{font-family:var(--font-display);font-size:30px;margin:0 0 4px}
#about h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
#about ul{padding-left:18px;margin:0}
#about li{margin:3px 0}
/* phone */
#mlist{display:none;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px 24px}
#mlist .dec{position:sticky;top:0;z-index:1;background:var(--bg);font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--muted);padding:12px 2px 6px}
#mlist .g{display:grid;grid-template-columns:5px 1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px 9px 0;margin:0 0 6px;font:inherit;color:var(--ink);overflow:hidden}
#mlist .g .bar{align-self:stretch;margin:-9px 0}
#mlist .g b{font-size:14.5px;font-weight:600;line-height:1.25;display:block}
#mlist .g .s{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
#mlist .g .y{font-family:var(--font-display);font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
#msheet{position:fixed;inset:0;z-index:25;background:var(--surface);overflow:auto;transform:translateY(102%);transition:transform .22s ease;padding:0 16px 32px;font-size:14px;line-height:1.5}
#msheet.show{transform:none}
#msheet .sh{position:sticky;top:0;padding:calc(12px + env(safe-area-inset-top)) 0 10px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:1}
#msheet .back{border:none;background:transparent;font-size:28px;line-height:1;padding:0 6px 0 0;color:var(--ink)}
#msheet h2{font-family:var(--font-display);font-weight:700;font-size:25px;margin:0;line-height:1.1}
#msheet .meta{font-size:12.5px;font-weight:600;margin-top:2px}
#msheet h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
#msheet .chipsrow{display:flex;flex-wrap:wrap;gap:6px}
#msheet .gchip{font-size:13px;padding:5px 11px}
#msheet .lk{font-size:12px;line-height:1.7;padding:0 9px}
body.m .sub{display:none}
body.m h1{font-size:22px}
body.m .logo{width:28px;height:28px}
body.m header{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;gap:7px}
body.m #viewseg{display:flex}
body.m .sbox{max-width:none;flex-basis:100%}
body.m .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
body.m .chips::-webkit-scrollbar{display:none}
body.m .chip{flex:0 0 auto}
body.m #fit,body.m label.toggle,body.m #clear{display:none}
body.m.list #zoomIn,body.m.list #zoomOut{display:none}
body.m.list #stage,body.m.list #panel{display:none}
body.m.list #mlist{display:block}
body.m #drawer{width:100vw}
@media (prefers-reduced-motion: reduce){.edge{transition:none}#msheet,#drawer{transition:none}}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <img class="logo" src="icons/logo.svg" alt="" aria-hidden="true">
    <h1>Genealogy of Classical Music</h1>
    <span class="sub" id="sub"></span>
  </div>
  <div class="controls">
    <div class="sbox"><input type="search" id="q" autocomplete="off" placeholder="Search a movement, person or work" aria-label="Search a movement, person or work" aria-controls="results"><div id="results" role="listbox" hidden></div></div>
    <div class="seg" id="graphseg" role="group" aria-label="Map"><button data-g="mov" class="on">Movements</button><button data-g="ppl">Masters &amp; Pupils</button></div>
    <div class="seg" id="viewseg" role="group" aria-label="View"><button data-v="list">List</button><button data-v="map">Map</button></div>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="fit">Fit all</button>
    <label class="toggle"><input type="checkbox" id="deep"> Trace full lineage</label>
    <button id="clear">Clear selection</button>
    <button id="aboutBtn" aria-label="About this map">About &amp; sources</button>
  </div>
  <div class="chips" id="chips" aria-label="Families"></div>
</header>
<div id="stage">
  <div id="lanehead"><div class="inner" id="laneinner"></div></div>
  <div id="yearcol"><div class="inner" id="yearinner"></div></div>
  <div id="scroller"><svg id="svgM" class="g" role="img" aria-label="Timeline of classical music movements with influence arrows"></svg><svg id="svgP" class="g" role="img" aria-label="Teacher and pupil lines" style="display:none"></svg></div>
</div>
<section id="panel" aria-live="polite"></section>
<main id="mlist" aria-label="Movements by period"></main>
<div id="msheet" role="dialog" aria-label="Movement details" aria-hidden="true"></div>
<div id="pop" role="dialog" aria-modal="false" aria-label="Top figures"></div>
<aside id="drawer" role="dialog" aria-label="Profile" aria-hidden="true"></aside>
<div id="about" role="dialog" aria-label="About this map"><div class="box" id="aboutBox"></div></div>
<script src="nodes.js"></script>
<script src="art.js"></script>
<script src="people.js"></script>
<script>
if (typeof ART === "undefined" || typeof PPL === "undefined"){
  document.addEventListener("DOMContentLoaded", () => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;z-index:99;background:#f4f1ea;color:#1b1a17;font:16px/1.5 system-ui,sans-serif;padding:32px;";
    d.innerHTML = "<h2 style='margin-top:0'>Some files are missing</h2><p>This page needs the files that come with it (nodes.js, art.js, people.js) in the same folder. If you opened it from inside a .zip file, extract it first and open index.html from the extracted folder.</p>";
    document.body.appendChild(d);
  });
}
</script>
<script>
"use strict";
/* ---------------- helpers ---------------- */
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i").replace(/İ/g,"I").toLowerCase();
const clean = t => t.replace(/\([^)]*\)/g, " ").replace(/\[[^\]]*\]/g, " ").replace(/[“”"]/g,"").replace(/\s+/g, " ").trim();
const dark = () => document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
function lighten(hex, k){ const n = parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; r=Math.round(r+(255-r)*k); g=Math.round(g+(255-g)*k); b=Math.round(b+(255-b)*k); return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
const COL = {}; function refreshColors(){ for (const f in FAM) COL[f] = dark() ? lighten(FAM[f].color, .38) : FAM[f].color; }
refreshColors();

/* ---------------- time scale (piecewise: early centuries compressed) ---------------- */
const SEG = [[500,800,.12],[800,1400,.85],[1400,1600,2.7],[1600,1750,5.6],[1750,2035,14.2]];
const TOP = 18;
function yOf(yr){ let y = TOP; for (const [a,b,k] of SEG){ if (yr <= a) break; y += (Math.min(yr,b) - a) * k; if (yr <= b) break; } return y; }
const TICKS = []; for (let y=800;y<1400;y+=100) TICKS.push([y,1]); for (let y=1400;y<1600;y+=50) TICKS.push([y,y%100===0]); for (let y=1600;y<1750;y+=25) TICKS.push([y,y%100===0||y%50===0]); for (let y=1750;y<=2030;y+=10) TICKS.push([y,y%50===0]);
const ERAS = [["Middle Ages",800],["Renaissance",1430],["Baroque",1600],["Classical",1750],["Romantic",1820],["Modern",1900],["Postwar",1945],["Today",1990]];
const yearLabel = y => y < 800 ? "root" : y;

/* ---------------- people ---------------- */
const P = {};
for (const name in PPL){
  const f = PPL[name].split("|");
  const m = (f[0]||"").match(/(\d{3,4})/); let birth = m ? +m[1] : null;
  if (birth && /^d\./.test(f[0])) birth -= 50;
  if (birth && /^fl\./.test(f[0])) birth -= 25;
  P[name] = {name, years:f[0]||"", nat:f[1]||"", role:f[2]||"", teachers:(f[3]||"").split(";").map(s=>s.trim()).filter(Boolean), sum:f[4]||"", lane:f[5]||"", birth, pupils:[], nodes:[], works:[]};
}
for (const n in P) P[n].teachers = P[n].teachers.filter(t => P[t]);
for (const n in P) P[n].teachers.forEach(t => P[t].pupils.push(n));
for (const d of D){ (ART[d[0]]||[]).forEach(row => { const [a, ...ws] = row.split("|"); if (!P[a]) return; P[a].nodes.push(d[0]); ws.forEach(w => P[a].works.push([w, d[0]])); }); }
const ENSEMBLE = /orchestra|quartet|choir|consort|ensemble|company|opera and ballet|manuscript|repertory|treatise|source|band|maker$/i;
const isPerson = p => !ENSEMBLE.test(p.role);
const VERIFIED = new Set(["Michael Tilson Thomas","Herbert Blomstedt","Stephen Kovacevich","Christoph von Dohnányi","Sofia Gubaidulina","György Kurtág","Klaus Mäkelä","Andris Nelsons","Gustavo Dudamel","Franz Welser-Möst","Kirill Petrenko","Simon Rattle","Eric Lu","Suna Kan","İlhan Usmanbaş","Ruşen Güneş","Ayla Erduran","Éliane Radigue","Rodion Shchedrin","Per Nørgård","Roger Norrington","Alfred Brendel","Maurizio Pollini","Antonio Pappano"]);

/* ---------------- movement graph ---------------- */
const LANE_W = 152, PILL_W = 142, PILL_H = 22, GAP = 4;
const byId = {};
D.forEach(d => byId[d[0]] = {id:d[0], short:d[1], full:d[2], year:d[3], fam:d[4], blurb:d[6]||"", parents:d[5].map(p=>p.replace("~","")), tparents:new Set(d[5].filter(p=>p[0]==="~").map(p=>p.slice(1))), children:[]});
Object.values(byId).forEach(n => { n.parents = [...new Set(n.parents)]; n.parents.forEach(p => { if (byId[p]) byId[p].children.push(n.id); }); });
const isT = (s,t) => byId[t] && byId[t].tparents.has(s);

function makeMovementGraph(){
  const nodes = Object.values(byId);
  let H = 0;
  ORDER.forEach((f, li) => {
    const ns = nodes.filter(n => n.fam === f).sort((a,b) => a.year - b.year || a.short.localeCompare(b.short));
    let last = -1e9;
    ns.forEach(n => { let y = yOf(n.year); if (y < last + PILL_H + GAP) y = last + PILL_H + GAP; n.x = 10 + li * LANE_W + (LANE_W - PILL_W)/2; n.y = y; last = y; H = Math.max(H, y + PILL_H); });

const PARTICLES = new Set(["van","von","de","da","del","di","du","la","le","der","den","d'","dos","y"]);
function shortName(n){
  let s = n.replace(/\s*\([^)]*\)/g, "");
  if (s.length <= 19) return s;
  const w = s.split(" "); if (w.length < 2) return s;
  let last = w.pop(); while (w.length && PARTICLES.has(w[w.length-1].toLowerCase())) last = w.pop() + " " + last;
  const ab = w.map(x => x.replace(/^(\p{L})[\p{L}'’.-]*/u, "$1.")).join(" ") + " " + last;
  return ab.length <= 22 ? ab : last;
}
const OVERRIDE = {"Wolfgang Amadeus Mozart":"A","Ludwig van Beethoven":"A","Joseph Haydn":"A","George Frideric Handel":"A","Franz Schubert":"A","Robert Schumann":"A","Johannes Brahms":"A","Felix Mendelssohn":"A","Franz Liszt":"P","Johann Sebastian Bach":"A","Gustav Mahler":"A","Richard Strauss":"A","Claude Debussy":"F","Maurice Ravel":"F","Antonín Dvořák":"R","Gabriel Fauré":"F","Camille Saint-Saëns":"F","Nadia Boulanger":"F","Antonio Salieri":"O","Leonard Bernstein":"K","Carl Czerny":"P","Clara Schumann":"P","Hans von Bülow":"K","Joseph Joachim":"V","Eugène Ysaÿe":"V","Olivier Messiaen":"F","Arnold Schoenberg":"X","Paul Hindemith":"A","Ferruccio Busoni":"P","Pablo Casals":"L","Anton Bruckner":"A"};
function personLane(p){
  if (OVERRIDE[p.name]) return OVERRIDE[p.name];
  if (p.lane) return p.lane;
  const c = {}; let best = null; p.nodes.forEach(id => { const f = byId[id].fam; c[f] = (c[f]||0) + 1; if (!best || c[f] > c[best]) best = f; });
  return best;
}
function makePersonGraph(){
  const PW = 124, COLW = 130, MAXC = 3;
  const ids = {}; let k = 0;
  const people = Object.values(P).filter(p => p.birth && (p.teachers.length || p.pupils.length) && isPerson(p) && personLane(p));
  people.forEach(p => ids[p.name] = "p" + (k++));
  const nodes = {};
  const sn = {}; people.forEach(p => { const s = shortName(p.name); sn[s] = (sn[s]||0) + 1; });
  const label = p => { const s = shortName(p.name); return sn[s] > 1 ? p.name.replace(/\s*\(([^)]*)\)/, (m, x) => " (" + x.split(" ")[0] + ")") : s; };
  people.forEach(p => { nodes[ids[p.name]] = {id:ids[p.name], name:p.name, short:label(p), full:p.name, years:p.years, birth:p.birth, fam:personLane(p), parents:p.teachers.filter(t => ids[t]).map(t => ids[t]), children:[]}; });
  Object.values(nodes).forEach(n => n.parents.forEach(pp => nodes[pp].children.push(n.id)));
  let x = 10, H = 0; const laneX = [], laneWs = [];
  ORDER.forEach(f => {
    const ns = Object.values(nodes).filter(n => n.fam === f).sort((a,b) => a.birth - b.birth || a.short.localeCompare(b.short));
    const cols = []; // bottom y per column
    ns.forEach(n => {
      let y = yOf(n.birth + 22), ci = cols.findIndex(b => b + GAP <= y);
      if (ci < 0 && cols.length < MAXC){ cols.push(-1e9); ci = cols.length - 1; }
      if (ci < 0){ ci = cols.indexOf(Math.min(...cols)); y = cols[ci] + GAP; }
      n.col = ci; n.y = y; cols[ci] = y + PILL_H; H = Math.max(H, y + PILL_H);
    });
    const nc = Math.max(1, cols.length), w = nc * COLW + 14;
    ns.forEach(n => n.x = x + 7 + n.col * COLW + (COLW - PW)/2);
    laneX.push(x); laneWs.push(w); x += w;
  });
  H = Math.max(H, yOf(2030)) + 40;
  return {kind:"ppl", nodes, ids, W:x + 10, H, laneX, laneWs, pw:PW};
}

function parseWork(w){
  if (w.startsWith("* ")) return {note:w.slice(2)};
  const [title, rec] = w.split(" ~ ");
  let perf = "", meta = "";
  if (rec){ const i = rec.indexOf(";"); perf = i < 0 ? rec : rec.slice(0, i); meta = i < 0 ? "" : rec.slice(i+1).trim(); }
  return {title:title.trim(), perf:perf.trim(), meta};
}
function links(person, wk){
  const who = clean(person), t = clean(wk.title), perf = clean(wk.perf);
  const parts = [];
  if (!/^anonymous|^st martial|^aquitanian/i.test(who) && !(perf && norm(perf).includes(norm(who)))) parts.push(who);
  parts.push(t); if (perf) parts.push(perf);
  const qt = parts.join(" ").replace(/[:;]/g, " ").replace(/\s+/g, " ").trim(), q = encodeURIComponent(qt);
  return `<a class="lk yt" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener" title="Search this recording on YouTube">▶ YouTube</a><a class="lk sp" href="https://open.spotify.com/search/${q}" data-q="${esc(qt)}" target="_blank" rel="noopener" title="Search this recording on Spotify">♫ Spotify</a>`;
}

             ["AllMusic", `https://www.allmusic.com/search/all/${q}`],
             ["Wikipedia", `https://en.wikipedia.org/w/index.php?search=${q}`]];
  if (composer) L.splice(2, 0, ["IMSLP scores", `https://imslp.org/index.php?search=${q}`]);
  if (/Turkish|Ottoman/.test(p.nat)) L.push(["Vikipedi (Türkçe)", `https://tr.wikipedia.org/w/index.php?search=${q}`]);
  if (/(conductor|orchestra)/i.test(p.role)) L.push(["Bachtrack", `https://bachtrack.com/search-all/${q}`]);
  return L.map(([t,u]) => `<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("");
}
function personChips(names){ return names.length ? names.map(n => `<button class="gchip dash" data-info="${esc(n)}" style="border-color:${COL[personLane(P[n]) || "E"]}">${esc(shortName(n))}${P[n].years ? " · " + esc(P[n].years) : ""}</button>`).join("") : `<span class="hint">none recorded</span>`; }
function showInfo(a){
  const p = P[a]; if (!p) return;
  const b = BIO[a];
  const nodes = [...new Set(p.nodes)];
  let h = `<div class="dh"><div><h2>${esc(a)}</h2><div class="kind">${esc(p.role)}${p.nat ? " · " + esc(p.nat) : ""}</div></div><button class="x" aria-label="Close profile">×</button></div>`;
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  h += `<dl>` + row(isPerson(p) ? "Life" : "Active", esc(p.years)) + row("Nationality", esc(p.nat)) + row("Role", esc(p.role)) + `</dl>`;
  h += `<p class="sum">${esc(b ? b.s : p.sum)}</p>`;
  if (b && b.s && p.sum && b.s.indexOf(p.sum.slice(0, 30)) < 0) {}
  if (b && b.f) h += `<h4>Notable facts</h4><ul>${b.f.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  if (isPerson(p)) h += `<h4>Teachers</h4><div class="crow">${personChips(p.teachers)}</div><h4>Pupils</h4><div class="crow">${personChips(p.pupils)}</div>`;
  if (nodes.length) h += `<h4>Appears in</h4><div class="crow">${nodes.map(id => `<button class="gchip" data-node="${id}" style="border-color:${COL[byId[id].fam]}">${esc(byId[id].short)} · ${yearLabel(byId[id].year)}</button>`).join("")}</div>`;
  const seen = new Set(), works = p.works.filter(([w]) => !seen.has(w) && seen.add(w));
  if (works.length) h += `<h4>Key works, recordings &amp; notes</h4><ul class="wk">${works.map(([w]) => workLI(a, w)).join("")}</ul>`;
  h += `<div class="actions">${GP.ids[a] ? `<button data-ppl="${esc(a)}">Show in Masters &amp; Pupils</button>` : ""}</div>`;
  h += `<h4>Further reading</h4><div class="read">${readLinks(a, p)}</div>`;
  h += `<div class="src">${b ? "Extended portrait" : "Profile"} written by Claude from standard music reference literature (see About &amp; sources); use the links above to check details. ${VERIFIED.has(a) ? "Recent dates and current posts for this entry were checked online on 18 November 2026." : "Dates are given as far as reliably known."}</div>`;
  if (!drawer.classList.contains("show")) history.pushState({gcm:"d"}, "");
  drawer.innerHTML = h; drawer.scrollTop = 0;
  drawer.classList.add("show"); drawer.setAttribute("aria-hidden", "false");
  drawer.querySelector(".x").focus({preventScroll:true});
}
function hideInfo(){ drawer.classList.remove("show"); drawer.setAttribute("aria-hidden", "true"); }
function closeInfo(){ if (history.state && history.state.gcm === "d") history.back(); else hideInfo(); }
drawer.addEventListener("click", e => {
  if (e.target.closest(".x")){ closeInfo(); return; }
  const i = e.target.closest("[data-info]"); if (i){ showInfo(i.dataset.info); return; }
  const n = e.target.closest("[data-node]"); if (n){ closeInfo(); if (document.body.classList.contains("list")) openSheet(n.dataset.node); else { setGraph("mov"); select(n.dataset.node, true); } return; }
  const pp = e.target.closest("[data-ppl]"); if (pp){ closeInfo(); setGraph("ppl", pp.dataset.ppl); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (about.classList.contains("show")) about.classList.remove("show"); else if (drawer.classList.contains("show")) closeInfo(); else if (msheet.classList.contains("show")) history.back(); else hidePop(); });

/* ---------------- search ---------------- */
const IDX = [];
Object.values(byId).forEach(n => IDX.push({k:"mov", id:n.id, label:n.full, key:norm(n.full + " " + n.short)}));
Object.values(P).forEach(p => IDX.push({k:"person", name:p.name, id:p.nodes[0] || null, key:norm(p.name)}));
Object.entries(ART).forEach(([id, rows]) => rows.forEach(r => { const [a, ...ws] = r.split("|"); ws.forEach(w => { const wk = parseWork(w); if (!wk.note) IDX.push({k:"work", id, person:a, work:w, title:wk.title, perf:wk.perf, key:norm(wk.title + " " + wk.perf)}); }); }));
const q = document.getElementById("q"), res = document.getElementById("results");
let hits = [], cur = -1;
function closeRes(){ res.hidden = true; res.innerHTML = ""; hits = []; cur = -1; }
function mark(){ res.querySelectorAll(".ritem").forEach(b => b.classList.toggle("cur", +b.dataset.i === cur)); const c = res.querySelector(".ritem.cur"); if (c) c.scrollIntoView({block:"nearest"}); }
function runSearch(){
  const raw = q.value.trim(), v = norm(raw);
  if (v.length < 2){ closeRes(); return; }
  const rank = h => h.key.startsWith(v) ? 0 : (h.key.includes(" " + v) ? 1 : 2);
  const pick = (k, n) => IDX.filter(h => h.k === k && h.key.includes(v)).sort((a,b) => rank(a) - rank(b)).slice(0, n);
  const g = pick("mov", 6), pe = pick("person", 12), wo = pick("work", 12);
  hits = [...g, ...pe, ...wo]; cur = hits.length ? 0 : -1;
  if (!hits.length){ res.innerHTML = `<div class="rhead">Nothing matches “${esc(raw)}”</div>`; res.hidden = false; return; }
  const tag = id => id ? `<span class="rg" style="color:${COL[byId[id].fam]}">${esc(byId[id].short)}</span>` : "";
  let html = "", i = 0;
  const sec = (title, arr, fn) => { if (!arr.length) return; html += `<div class="rhead">${title}</div>`; arr.forEach(h => { html += `<button type="button" class="ritem" role="option" data-i="${i++}">${fn(h)}</button>`; }); };
  sec("Movements", g, h => `<b>${esc(h.label)}</b>${tag(h.id)}`);
  sec("People & ensembles", pe, h => `<b>${esc(h.name)}</b><span class="ra">${esc(P[h.name].years)}</span>${tag(h.id)}`);
  sec("Works & recordings", wo, h => `<b>${esc(h.title)}</b><span class="ra">${esc(h.person)}${h.perf ? " · " + esc(h.perf) : ""}</span>${tag(h.id)}`);
  res.innerHTML = html; res.hidden = false; mark();
}
function go(h){
  closeRes(); q.blur();
  if (h.k === "person"){
    if (G === GP && GP.ids[h.name]){ select(GP.ids[h.name], true); return; }
    showInfo(h.name); if (h.id && !document.body.classList.contains("list")){ setGraph("mov"); select(h.id, true); }
    return;
  }
  if (document.body.classList.contains("list")){ openSheet(h.id, h.person, h.work); return; }
  setGraph("mov"); select(h.id, false); scrollToNode(h.id, false);
  if (h.k === "work"){ keepPop = Date.now() + 800; requestAnimationFrame(() => showPop(h.id, Math.max(12, innerWidth/2 - 210), 110, h.person, h.work)); }
}
q.addEventListener("input", runSearch); q.addEventListener("focus", runSearch);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && hits.length){ e.preventDefault(); cur = (cur + 1) % hits.length; mark(); }
  else if (e.key === "ArrowUp" && hits.length){ e.preventDefault(); cur = (cur - 1 + hits.length) % hits.length; mark(); }
  else if (e.key === "Enter" && hits[cur]){ e.preventDefault(); go(hits[cur]); }
  else if (e.key === "Escape") closeRes();
});
res.addEventListener("click", e => { const b = e.target.closest(".ritem"); if (b) go(hits[+b.dataset.i]); });
document.addEventListener("pointerdown", e => { if (!res.hidden && !res.contains(e.target) && e.target !== q) closeRes(); });

/* ---------------- about & sources ---------------- */
const about = document.getElementById("about");
const BOOKS = [
 ["Grove Music Online (Oxford University Press)","the standard reference for composers, performers and terms"],
 ["Richard Taruskin, The Oxford History of Western Music (2005)","six volumes from the earliest notation to the late 20th century"],
 ["J. Peter Burkholder, Donald J. Grout and Claude V. Palisca, A History of Western Music (Norton)","the classic university textbook"],
 ["Richard Hoppin, Medieval Music (1978); Gustave Reese, Music in the Renaissance (1954); Manfred Bukofzer, Music in the Baroque Era (1947)","the period surveys behind the early lanes"],
 ["Charles Rosen, The Classical Style (1971)","Haydn, Mozart and Beethoven"],
 ["Alex Ross, The Rest Is Noise (2007); Paul Griffiths, Modern Music and After (2010)","the 20th century and after"],
 ["Harold C. Schonberg, The Great Pianists (1963) and The Great Conductors (1967)","performer lineages"],
 ["Boris Schwarz, Great Masters of the Violin (1983); Margaret Campbell, The Great Cellists (1988)","string schools and teacher chains"],
 ["Norman Lebrecht, The Maestro Myth (1991)","conductors and orchestras"],
 ["John Rosselli, Singers of Italian Opera (1992)","castrati, bel canto and the García school"],
 ["Walter Feldman, Music of the Ottoman Court (1996)","makam, peşrev and the Ottoman repertory"],
 ["Béla Bartók, Turkish Folk Music from Asia Minor (ed. Benjamin Suchoff, 1976)","the 1936 Anatolian field trip with Saygun"],
 ["Evin İlyasoğlu, 71 Türk Bestecisi (1989) and Zaman İçinde Müzik (1994)","Turkish composers of the Republic"],
 ["Gramophone magazine and The Penguin Guide to Recorded Classical Music","for the choice of reference recordings"]
];
document.getElementById("aboutBox").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h2>About this map</h2><button class="x" aria-label="Close">×</button></div>
<p>This is a family tree of Western classical music from Gregorian chant to the music of today, with a Turkish branch from mehter and Ottoman makam to the composers and performers of the Republic. It has two views.</p>
<h3>Movements</h3><p>${D.length} movements, schools, traditions, performer schools and orchestras, in ${ORDER.length} lanes. Time runs top to bottom; the early centuries are compressed so the dense 18th to 21st centuries have room. Solid arrows show stylistic influence and dashed arrows show teacher-to-pupil lines between schools. Right-click (or long-press) a movement for its top figures, their key works, and a reference recording for each.</p>
<h3>Masters &amp; Pupils</h3><p>${Object.keys(GP.nodes).length} people linked by ${GP.edgeEls.length} documented teacher-to-pupil lines, from Willaert and Sweelinck to Panula's Finnish conductors and the Chopin Competition winners. Each person sits in the lane of their main activity, at roughly the age of 22.</p>
<h3>Recordings</h3><p>For each work a landmark recording is named: famous studio cycles, legendary live concerts (Furtwängler's 1951 Bayreuth Ninth, Horowitz in Moscow, Bernstein's 1989 Berlin Ninth) and the virtuosos' own signature performances. The YouTube and Spotify buttons search for that work and performer.</p>
<h3>Profiles and sources</h3><p>Profiles cover ${Object.keys(P).length} people and ensembles; ${Object.keys(BIO).length} have an extended portrait. They were written by Claude from the standard literature below and cross-checked where possible; every profile links to Grove Music Online, Britannica, AllMusic, IMSLP (scores) and Wikipedia so you can check details. Deaths and current posts since 2025 (for example Tilson Thomas and Blomstedt in 2026, Dudamel at the New York Philharmonic, Mäkelä's 2027 posts, the 2025 Chopin Competition) were checked online on 18 November 2026. Treat it as a well-researched guide rather than a scholarly edition, and check key facts before publishing.</p>
<h3>Further reading</h3><ul>${BOOKS.map(([t, d]) => `<li><b>${esc(t)}</b>: ${esc(d)}</li>`).join("")}</ul>
<p class="hint" style="margin-top:14px">Lane colours: ${ORDER.map(f => `<span style="color:${COL[f]};font-weight:600">${FAM[f].hdr}</span>`).join(" · ")}</p>`;
document.getElementById("aboutBtn").onclick = () => about.classList.add("show");
about.addEventListener("click", e => { if (e.target === about || e.target.closest(".x")) about.classList.remove("show"); });

/* ---------------- phone view ---------------- */
const mq = matchMedia("(max-width: 760px)");
const mlist = document.getElementById("mlist"), msheet = document.getElementById("msheet");
let view = "list"; try { view = localStorage.getItem("gcm_view") || "list"; } catch (e) {}
let mFam = null;
function setMode(){
  const m = mq.matches;
  document.body.classList.toggle("m", m);
  document.body.classList.toggle("list", m && view === "list" && G === GM);
  document.querySelectorAll("#viewseg button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
}
function period(y){ if (y < 800) return "Roots"; if (y < 1430) return "Middle Ages"; if (y < 1600) return "Renaissance"; if (y < 1750) return "Baroque"; if (y < 1820) return "Classical era"; if (y < 1900) return "19th century"; return Math.floor(y/10)*10 + "s"; }
function renderList(){
  const ns = Object.values(byId).filter(n => !mFam || n.fam === mFam).sort((a, b) => a.year - b.year || a.full.localeCompare(b.full));
  let h = "", last = null;
  for (const n of ns){
    const d = period(n.year); if (d !== last){ h += `<div class="dec">${d}</div>`; last = d; }
    const from = n.parents.slice().sort((a, b) => byId[a].year - byId[b].year).map(p => byId[p].short).join(", ");
    h += `<button class="g" data-g="${n.id}"><span class="bar" style="background:${COL[n.fam]}"></span><span><b>${esc(n.full)}</b><span class="s">${from ? "from " + esc(from) : esc(FAM[n.fam].name)}${n.children.length ? ` · led to ${n.children.length}` : ""}</span></span><span class="y">${n.year < 800 ? "" : n.year}</span></button>`;
  }
  mlist.innerHTML = h || `<div class="note">Nothing here.</div>`;
}
function sheetHTML(id, hiA, hiW){
  const n = byId[id], c = COL[n.fam];
  const by = k => n[k].slice().sort((a, b) => byId[a].year - byId[b].year);
  const chips = (ids, dir) => ids.length ? ids.map(x => `<button class="gchip${(dir === "up" ? isT(x, id) : isT(id, x)) ? " dash" : ""}" data-go="${x}" style="border-color:${COL[byId[x].fam]}">${esc(byId[x].short)} · ${yearLabel(byId[x].year)}</button>`).join("") : `<span class="hint">none</span>`;
  let h = `<div class="sh"><button class="back" aria-label="Back">‹</button><div><h2>${esc(n.full)}</h2><div class="meta" style="color:${c}">${esc(FAM[n.fam].name)} · ${n.year < 800 ? "root source" : "c. " + n.year}</div></div></div>`;
  if (n.blurb) h += `<p>${esc(n.blurb)}</p>`;
  h += `<h4>Came from</h4><div class="chipsrow">${chips(by("parents"), "up")}</div><h4>Led to</h4><div class="chipsrow">${chips(by("children"), "down")}</div>`;
  h += ART[id] ? `<h4>Top figures</h4>` + figuresHTML(id, hiA, hiW) : `<div class="note">A source outside the classical tradition.</div>`;
  return h;
}
function openSheet(id, hiA, hiW, push){
  msheet.innerHTML = sheetHTML(id, hiA, hiW);
  msheet.classList.add("show"); msheet.setAttribute("aria-hidden", "false"); msheet.scrollTop = 0;
  const hit = msheet.querySelector(".hit"); if (hit) msheet.scrollTop = Math.max(0, hit.offsetTop - 90);
  if (push !== false) history.pushState({gcm:"s", id}, "");
}
function closeSheet(){ msheet.classList.remove("show"); msheet.setAttribute("aria-hidden", "true"); }
mlist.addEventListener("click", e => { const b = e.target.closest(".g"); if (b) openSheet(b.dataset.g); });
msheet.addEventListener("click", e => {
  if (e.target.closest(".back")){ history.back(); return; }
  const g = e.target.closest("[data-go]"); if (g){ openSheet(g.dataset.go); return; }
  const i = e.target.closest(".ib"); if (i) showInfo(i.dataset.info);
});
addEventListener("popstate", () => {
  if (drawer.classList.contains("show")){ hideInfo(); return; }
  const st = history.state;
  if (st && st.gcm === "s") openSheet(st.id, null, null, false); else closeSheet();
});
document.getElementById("viewseg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v; try { localStorage.setItem("gcm_view", view); } catch (err) {}
  if (view === "list") setGraph("mov");
  setMode();
  if (view === "map") requestAnimationFrame(() => { drawRails(); select(selected || "viennese", true); });
});
mq.addEventListener("change", () => { setMode(); if (!mq.matches) requestAnimationFrame(drawRails); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { refreshColors(); drawGraph(GM, svgM); drawGraph(GP, svgP); drawRails(); apply(); });
setMode(); renderList();

/* open on Viennese Classicism so the page shows a working state */
drawRails();
setZoom(scroller.clientWidth < 700 ? 0.7 : 0.82, false);
select("viennese", true);

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
